version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: yapasgachis-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: yapasgachis
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yapasgachis-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: yapasgachis-redis
    restart: always
    command: redis-server --requirepass redispassword
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - yapasgachis-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # API Application (development)
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yapasgachis-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@postgres:5432/yapasgachis?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yapasgachis-network
    command: npm run dev

  # Worker for background jobs
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yapasgachis-worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@postgres:5432/yapasgachis?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yapasgachis-network
    command: npm run queue:worker

  # pgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yapasgachis-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@yapasgachis.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - yapasgachis-network

  # Redis Commander (optional - for Redis management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: yapasgachis-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redispassword
    ports:
      - '8081:8081'
    depends_on:
      - redis
    networks:
      - yapasgachis-network

  # Evolution API (WhatsApp Integration)
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: yapasgachis-evolution-api
    restart: unless-stopped
    environment:
      # Server Configuration
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080

      # Authentication
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-yapasgachis-evolution-key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'

      # Database - use the same PostgreSQL
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:password@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_client
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_DATA_MESSAGES_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'
      DATABASE_SAVE_DATA_LABELS: 'true'
      DATABASE_SAVE_DATA_HISTORIC: 'true'

      # Redis Cache
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://:redispassword@redis:6379/1
      CACHE_REDIS_TTL: 604800
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: 'true'
      CACHE_LOCAL_ENABLED: 'false'

      # QR Code Settings
      QRCODE_LIMIT: 30
      QRCODE_COLOR: '#000000'

      # Session Config
      CONFIG_SESSION_PHONE_CLIENT: YapaGachis
      CONFIG_SESSION_PHONE_NAME: Chrome

      # Webhook (for receiving WhatsApp events)
      WEBHOOK_GLOBAL_ENABLED: 'false'
      WEBHOOK_GLOBAL_URL: ''

      # WebSocket
      WEBSOCKET_ENABLED: 'true'
      WEBSOCKET_GLOBAL_EVENTS: 'false'

      # Logging
      LOG_LEVEL: 'ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS'
      LOG_COLOR: 'true'
      LOG_BAILEYS: error

      # Instance deletion timeout (in seconds)
      DEL_INSTANCE: 'false'

      # Language
      LANGUAGE: fr
    ports:
      - '8080:8080'
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yapasgachis-network

networks:
  yapasgachis-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  evolution_instances:
    driver: local
