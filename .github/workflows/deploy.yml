name: Deploy Pipeline

on:
  push:
    branches: [main, master, production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  NODE_VERSION: '20.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./src/infrastructure/database/prisma/schema.prisma

      - name: Run linter
        run: npm run lint || true

      - name: Type check
        run: npm run type-check || true

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.yapasgachis.com

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            /opt/scripts/deploy/deploy-yapasgachis.sh

      - name: Health check
        run: |
          sleep 15
          curl -f https://api.yapasgachis.com/health || exit 1

      - name: Notify deployment success
        if: success()
        run: echo "Deployment successful to https://api.yapasgachis.com"

      - name: Notify deployment failure
        if: failure()
        run: echo "Deployment failed! Check the logs for details."
