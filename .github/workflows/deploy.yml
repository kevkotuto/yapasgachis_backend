name: Deploy Pipeline

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  NODE_VERSION: '20.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint || true

      - name: Type check
        run: npm run type-check || true

  deploy-production:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://api.yapasgachis.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /var/www/yapasgachis

            # Pull latest changes
            git fetch origin production
            git reset --hard origin/production

            # Install dependencies
            npm ci --production=false

            # Generate Prisma client
            npx prisma generate

            # Build TypeScript
            npx tsc -p tsconfig.build.json --noEmitOnError false || true

            # Run database migrations
            npx prisma db push --accept-data-loss

            # Restart PM2 process
            pm2 restart yapasgachis-api --update-env

            # Save PM2 process list
            pm2 save

      - name: Health check
        run: |
          sleep 15
          curl -f https://api.yapasgachis.com/health || exit 1

      - name: Notify deployment success
        if: success()
        run: echo "Deployment successful to https://api.yapasgachis.com"

      - name: Notify deployment failure
        if: failure()
        run: echo "Deployment failed! Check the logs for details."
